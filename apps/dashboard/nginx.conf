server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml text/javascript;

    # Fichiers hachés par le build (main-XXXX.js, chunk-XXXX.js, styles-XXXX.css) :
    # leur nom change à chaque build, donc on peut les cacher sans limite. C'est
    # `immutable` qui évite même la requête de revalidation.
    location ~ "^/(main|chunk|styles|polyfills)-[A-Z0-9]+\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Angular HTML5 routing. index.html ne doit JAMAIS être servi depuis le cache
    # sans revalidation : c'est lui qui nomme les fichiers hachés ci-dessus, donc
    # un index.html périmé fait charger l'ancienne version de l'app en entier.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # API REST proxy → api service
    location /api {
        proxy_pass         http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
    }

    # Socket.io proxy (HTTP polling + WebSocket upgrade)
    location /socket.io {
        proxy_pass             http://api:3000;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade    $http_upgrade;
        proxy_set_header       Connection "Upgrade";
        proxy_set_header       Host       $host;
        proxy_cache_bypass     $http_upgrade;
        proxy_read_timeout     86400s;
    }
}
