<aside class="metrics-panel">

  <!-- System -->
  <div class="mp-section">
    <div class="mp-section-label">Système</div>

    <div class="mp-row">
      <span class="mp-label">CPU</span>
      <div class="mp-bar-bg">
        <div class="mp-bar-fill cpu" [style.width.%]="cpu"></div>
      </div>
      <span class="mp-value">{{ cpu }}%</span>
      <span *ngIf="cpuTemp !== null"
            class="mp-temp-badge"
            [class]="'mp-temp-badge ' + tempClass(cpuTemp!)">
        {{ cpuTemp }}°
      </span>
    </div>

    <div class="mp-row">
      <span class="mp-label">RAM</span>
      <div class="mp-bar-bg">
        <div class="mp-bar-fill ram" [style.width.%]="ramPct"></div>
      </div>
      <span class="mp-value">{{ ramPct }}%</span>
    </div>

    <div class="mp-sub">{{ ramUsed }} / {{ ramTotal }} Go</div>

    <div class="mp-divider"></div>

    <div class="mp-net-row">
      <lucide-icon [img]="icons.Download" [size]="10" strokeWidth="2.5" color="var(--text3)"></lucide-icon>
      <span class="mp-net-label">RX</span>
      <span class="mp-net-value">{{ rx }}</span>
    </div>

    <div class="mp-net-row">
      <lucide-icon [img]="icons.Upload" [size]="10" strokeWidth="2.5" color="var(--text3)"></lucide-icon>
      <span class="mp-net-label">TX</span>
      <span class="mp-net-value">{{ tx }}</span>
    </div>
  </div>

  <!-- Températures -->
  <div class="mp-section" *ngIf="temps.length > 0">
    <div class="mp-section-label">Températures</div>

    <div class="mp-row" *ngFor="let t of temps; trackBy: trackTemp">
      <span class="mp-label mp-label--disk">{{ t.label }}</span>
      <span class="mp-temp-badge" [class]="'mp-temp-badge ' + tempClass(t.celsius)" style="margin-left:auto">{{ t.celsius }}°</span>
    </div>
  </div>

  <!-- Storage -->
  <div class="mp-section" *ngIf="disks.length > 0">
    <div class="mp-section-label">Stockage</div>

    <div class="mp-disk-entry" *ngFor="let d of disks">
      <div class="mp-row">
        <span class="mp-label mp-label--disk">{{ d.mount }}</span>
        <div class="mp-bar-bg">
          <div [class]="'mp-bar-fill disk ' + diskClass(d)"
               [style.width.%]="d.usedPercent"></div>
        </div>
        <span class="mp-value">{{ d.usedPercent }}%</span>
      </div>
      <div class="mp-sub">{{ formatDisk(d.usedGB) }} / {{ formatDisk(d.totalGB) }}</div>
    </div>
  </div>

</aside>
