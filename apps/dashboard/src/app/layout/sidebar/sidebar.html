<nav class="sidebar">

  <div class="nav-section">
    <span class="section-label">Navigation</span>
    @for (item of navMain; track item.route) {
      <a class="nav-item" [routerLink]="item.route" routerLinkActive="active" (click)="layout.closeSidebar()" [title]="item.label">
        <lucide-icon [img]="item.icon" [size]="16" strokeWidth="2" class="nav-icon"></lucide-icon>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    }
  </div>

  <div class="nav-section nav-bottom">
    @for (item of navAdmin; track item.route) {
      <a class="nav-item nav-item-admin" [routerLink]="item.route" routerLinkActive="active"
         (click)="layout.closeSidebar()" [title]="item.label">
        <lucide-icon [img]="item.icon" [size]="16" strokeWidth="2" class="nav-icon"></lucide-icon>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    }
  </div>

</nav>
