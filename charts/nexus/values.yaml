# Values par défaut de la chart nexus.
# Les values d'environnement (homelab, etc.) surchargent ce fichier — voir le
# repo d'infra (pattern multi-sources ArgoCD).

api:
  image:
    repository: ghcr.io/aexils/nexus-api
    # Tag immuable (SHA du commit) écrit par ArgoCD Image Updater dans les
    # values d'environnement — "latest" n'est que le défaut de bootstrap.
    tag: latest
    pullPolicy: IfNotPresent
  # Variables d'environnement injectées telles quelles dans le conteneur api.
  # Les intégrations (Kodi, Jellyfin, PSN...) sont volontairement absentes :
  # services down en attendant le refactor. Les ajouter ici le moment venu
  # (et les secrets via un Secret référencé, jamais en clair dans les values).
  env:
    PORT: "3000"
    CORS_ORIGIN: "*"
    EXPENSE_DB_PATH: /nexus-state/expenses.db
    LOG_DB_PATH: /nexus-state/logs.db
    KODI_STATE_PATH: /nexus-state/kodi-state.json
    ABS_STATE_PATH: /nexus-state/abs-state.json
  # Noms de Secrets du namespace injectés en env (tokens d'intégration — voir
  # le repo d'infra pour les SealedSecrets). Vide par défaut.
  envFromSecrets: []
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

dashboard:
  image:
    repository: ghcr.io/aexils/nexus-dashboard
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

rbac:
  enabled: true   # ServiceAccount nexus-api + ClusterRole lecture (metrics-server, nodes, deployments, jobs, events)

persistence:
  size: 1Gi
  # vide = StorageClass par défaut du cluster
  storageClassName: ""

route:
  enabled: true
  hostname: nexus.example.com
  parentRef:
    name: homelab-gw
    namespace: envoy-gateway-system
