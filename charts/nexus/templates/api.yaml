# Le Service DOIT s'appeler "api" : le nginx du dashboard proxifie
# /api et /socket.io vers http://api:3000 (résolution DNS du namespace).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: nexus
spec:
  replicas: 1          # SQLite dans le volume RWO : une seule instance, toujours
  strategy:
    type: Recreate     # évite deux pods sur la même base pendant un rollout
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: nexus
    spec:
      serviceAccountName: {{ if .Values.rbac.enabled }}nexus-api{{ else }}default{{ end }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: 3000
          env:
            {{- range $k, $v := .Values.api.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- with .Values.api.aggregator }}
            {{- if .enabled }}
            # Préférences Aggregator : API privée kube-aggregator, certificat client DÉDIÉ.
            - name: KAGG_URL
              value: {{ .url | quote }}
            - name: KAGG_SERVER_NAME
              value: {{ .serverName | quote }}
            - name: KAGG_TLS_DIR
              value: /kagg-tls
            - name: NEXUS_WRITE_ORIGINS
              value: {{ .writeOrigins | quote }}
            - name: NEXUS_SECURE_COOKIE
              value: {{ .secureCookie | quote }}
            {{- end }}
            {{- end }}
          {{- if .Values.api.envFromSecrets }}
          # Tokens d'intégration : jamais dans les values — des Secrets du
          # namespace (SealedSecrets côté infra), injectés tels quels.
          envFrom:
            {{- range .Values.api.envFromSecrets }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- end }}
          volumeMounts:
            - name: state
              mountPath: /nexus-state
            {{- if .Values.api.aggregator.enabled }}
            - name: kagg-tls
              mountPath: /kagg-tls
              readOnly: true
            {{- end }}
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 15
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: nexus-state
        {{- if .Values.api.aggregator.enabled }}
        - name: kagg-tls
          secret:
            secretName: {{ .Values.api.aggregator.tlsSecret }}
            defaultMode: 0400
            items:
              - { key: ca.crt, path: ca.crt }
              - { key: client.crt, path: client.crt }
              - { key: client.key, path: client.key }
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: nexus
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - port: 3000
      targetPort: 3000
