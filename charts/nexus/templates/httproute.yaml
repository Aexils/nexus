{{- if .Values.route.enabled }}
# Tout passe par le dashboard : son nginx sert le front et proxifie
# /api + /socket.io (WebSocket) vers le service api.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nexus
  labels:
    app.kubernetes.io/part-of: nexus
spec:
  parentRefs:
    - name: {{ .Values.route.parentRef.name }}
      namespace: {{ .Values.route.parentRef.namespace }}
  hostnames:
    - {{ .Values.route.hostname | quote }}
  rules:
    - backendRefs:
        - name: dashboard
          port: 80
{{- end }}
